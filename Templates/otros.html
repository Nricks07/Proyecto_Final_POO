{% extends 'base.html' %}
{% block title %} Otros Equipos {% endblock %}
{% block content %}
<div class="row mb-5 align-items-center justify-content-center text-center text-md-start mt-5">
    
    <div class="col-md-5">
        <h1 class="fw-bold display-5" style="color: var(--blue-dark);">Otros Equipos</h1>
        <p class="text-muted lead mt-2">¿Tienes un smartwatch, audífonos, impresora o algún otro aparato? Descríbelo aquí y lo revisamos.</p>
    </div>
    
    <div class="col-md-4 mt-4 mt-md-0 offset-md-1">
        <img src="{{url_for('static', filename='img/otrosCanva.png')}}" alt="Otros Equipos" class="img-fluid shadow-sm imgPort rounded-4" style="max-height: 300px; object-fit: cover;">
    </div>
</div>

<hr class="my-5" style="border-top: 2px solid #cbd5e1;">

<div class="row mb-5 p-2 justify-content-center">
    <div class="col-md-8">
        <div class="p-4 p-md-5 shadow-sm rounded-4" style="background-color: var(--bg-color);">
            <form action="" method="post">
                
                <h4 class="fw-bold text-center mb-4" style="color: var(--blue-dark);">Detalles del Equipo</h4>

                <div class="row mb-4 align-items-center">
                    <label for="tipoAparato" class="col-md-3 fw-bold text-dark col-form-label text-md-end">Aparato:</label>
                    <div class="col-md-9">
                        <input type="text" name="tipoAparato" id="tipoAparato" class="form-control border-0 p-2 shadow-sm" placeholder="Ej. Smartwatch, Impresora..." required>
                    </div>
                </div>

                <div class="row mb-4 align-items-center">
                    <label for="marca" class="col-md-3 fw-bold text-dark col-form-label text-md-end">Marca:</label>
                    <div class="col-md-9">
                        <input type="text" name="marca" id="marca" class="form-control border-0 p-2 shadow-sm" placeholder="Ej. Apple, Epson, Sony..." required>
                    </div>
                </div>

                <div class="row mb-4 align-items-center">
                    <label for="modelo" class="col-md-3 fw-bold text-dark col-form-label text-md-end">Modelo:</label>
                    <div class="col-md-9">
                        <input type="text" name="modelo" id="modelo" class="form-control border-0 p-2 shadow-sm" placeholder="Ej. Watch Series 8, EcoTank L3150..." required>
                    </div>
                </div>

                <div class="row mb-4 align-items-center">
                    <label for="problemas" class="col-md-3 fw-bold text-dark col-form-label text-md-end">Falla principal:</label>
                    <div class="col-md-9">
                        <input type="text" name="problemas" id="problemas" class="form-control border-0 p-2 shadow-sm" placeholder="Ej. No enciende, pantalla rota..." required>
                    </div>
                </div>

                <div class="row mb-4">
                    <label for="detalles" class="col-md-3 col-form-label fw-bold text-dark text-md-end">Más detalles:</label>
                    <div class="col-md-9">
                        <textarea class="form-control rounded-3 border-0 p-3 shadow-sm" id="detalles" name="detalles" rows="3" placeholder="Describe aquí qué le pasa a tu equipo..." required></textarea>
                    </div>
                </div>

                <div class="row mt-5">
                    <div class="col-md-9 offset-md-3">
                        <button type="submit" class="btn-primary-custom btn w-100 py-3 shadow-sm rounded-pill fw-bold">Generar Ticket Especial</button>
                    </div>
                </div> 
                
            </form>
        </div>
    </div>
</div>
{% endblock %}
