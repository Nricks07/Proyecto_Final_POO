<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TechFix - Reparaciones{% endblock %}</title>
    <!-- Bootstrap CSS desde CDN (no necesitas descargarlo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nuestro CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">TechFix | Puebla</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index')}}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('servicios')}}">Servicios</a></li>
                    {% if session.get('nombre') %}
                        
                        <li class="nav-item"><span class="nav-link text-white fw-light">Hola, {{ session.nombre }}</span></li>
                        {% if session.get('rol') == 'Cliente' %}
                            <li class="nav-item"><a class="nav-link" href="{{ url_for('Tickets')}}">🛒 | Mis Tickets</a></li>
                        {% endif %}
                        
                        <li class="nav-item"><a class="nav-link btn btn-danger px-3 ms-2 text-white" style="background-color: #dc3545; border:none;" href="{{ url_for('logout')}}">Salir</a></li>

                    {% else %}
                        <li class="nav-item"><a class="nav-link btn btn-primary-custom px-3 ms-2" href="{{ url_for('login')}}">Iniciar Sesión</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido dinámico (Aquí se inyectarán las otras páginas) -->
    <main class="container my-5">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
